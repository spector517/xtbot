version: 1
stages:
  - name: start
    message:
      parse_mode: plain
      text: Text of message
      buttons:
        - - display: button1
            data: button1_data
        - - display: button2
            data: button2_data
    remove_buttons: true
    accept:
      - some_acceptor:
    actions:
      - executor:
          arg1: value1
          arg2: value2
        register: var_name
    save:
      some_key: some_value
    next: null