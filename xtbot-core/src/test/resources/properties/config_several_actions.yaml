version: 1
stages:
  - name: start
    fail: true
    message:
      parse_mode: plain
      text: Text of message
      buttons:
        - - display: button1
            data: button1_data
        - - display: button2
            data: button2_data
    remove_buttons: true
    accept:
      - x.accept.callback: vpn-advantages|about-procedure|vps-rent|stop
    actions:
      - executor1:
          arg1: value1
          arg2: value2
        executor2:
          arg1: value1
          arg2: value2
    save:
      some_key: some_value
    next: null